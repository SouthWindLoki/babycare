<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>记用药 · 宝宝日常</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="/baby-favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head>
<body data-operation="medication"><main class="shell operation-shell"><header class="topbar"><a href="/" class="back-link">← 返回首页</a><span class="operation-brand" id="brand-name">宝宝日常</span></header>
<section class="operation-heading"><p class="eyebrow">用药记录</p><h1>记用药</h1><p>记录什么时候用了什么药，方便照护时查看。</p></section>
<section class="panel operation-panel"><form id="operation-form">
<label>用药时间<input id="event-time" name="occurredAt" type="datetime-local" required></label>
<div class="common-medicines"><div class="common-medicine-heading"><span class="field-label">常用药品</span><button type="button" class="secondary-button add-medicine" id="add-common-medicine">＋ 添加常用药</button></div><p class="field-hint common-hint">点击药品快速添加，单位随药品带入。</p><div class="medicine-tags" id="common-medicine-tags"></div><p id="common-load-message" role="status"></p><button type="button" class="secondary-button add-medicine" id="retry-common-medicines" hidden>重新加载常用药</button></div>
<fieldset class="medicine-list"><legend>记录药品 <button type="button" class="secondary-button add-medicine" id="add-medicine">＋ 添加药品</button></legend><div id="medicine-items"></div></fieldset>
<label>备注（选填）<textarea name="note" maxlength="1000" placeholder="请填写备注信息"></textarea></label>
<div class="medication-photo-field"><p class="field-label">照片（选填）</p><div class="photo-pickers"><label class="photo-picker"><span>拍照</span><input id="camera-photo" class="file-control" type="file" accept="image/*" capture="environment"></label><label class="photo-picker secondary-picker"><span>从相册选择</span><input id="gallery-photo" class="file-control" type="file" accept="image/*"></label></div><div class="photo-preview" id="photo-preview" hidden><img id="selected-photo" alt="已选择的用药照片"><p>已选择照片</p></div></div>
<div class="operation-feedback" id="operation-message" role="status"></div><div class="operation-footer"><button class="primary-button full-width operation-submit" type="submit">保存用药记录</button></div>
</form></section><p class="operation-tip">药品和剂量请以医生或药品说明为准，不要自行加量。</p><div class="toast" id="toast" role="status"></div></main><dialog id="common-medicine-dialog" class="nutrition-dialog"><form id="common-medicine-form"><h3 id="common-medicine-title">添加常用药</h3><label>药品名称<input id="common-medicine-name" maxlength="50" placeholder="填写药品名称" required></label><label>计量单位<input id="common-medicine-unit" maxlength="12" placeholder="例如：滴、粒、毫升" required></label><div class="unit-shortcuts" aria-label="常用计量单位"><button type="button">滴</button><button type="button">粒</button><button type="button">毫升</button><button type="button">毫克</button><button type="button">袋</button><button type="button">片</button></div><p id="common-medicine-error" class="operation-feedback" role="status"></p><div class="common-dialog-actions"><button type="button" id="cancel-common-medicine" class="secondary-button">取消</button><button type="submit" class="primary-button">保存常用药</button></div></form><section class="configured-common-medicines" aria-label="已添加的常用药"><h4>已添加的常用药</h4><div id="configured-common-medicines"></div></section></dialog><script type="module" src="/operation.js"></script></body></html>
