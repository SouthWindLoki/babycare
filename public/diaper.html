<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>换尿布 · 宝宝日常</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="/baby-favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head><body data-operation="diaper"><main class="shell operation-shell"><header class="topbar"><a href="/" class="back-link">← 返回首页</a><span class="operation-brand" id="brand-name">宝宝日常</span></header><section class="operation-heading"><p class="eyebrow">换好了，记一下</p><h1>换尿布</h1><p>记下这次更换时间，方便照护的人一起了解规律。</p></section><section class="panel operation-panel"><form id="operation-form"><label>更换时间<input id="event-time" name="occurredAt" type="datetime-local" required></label><label>备注（选填）<input name="note" type="text" maxlength="160" placeholder="例如：尿布、便便或宝宝状态"></label><div class="operation-feedback" id="operation-message" role="status"></div><div class="operation-footer"><button type="submit" class="primary-button full-width operation-submit">保存换尿布时间</button></div></form></section><p class="operation-tip">首页的最近日常会显示这次更换的日期和具体时间。</p><div class="toast" id="toast" role="status"></div></main><script type="module" src="/operation.js"></script></body></html>
