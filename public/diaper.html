<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>记湿尿布 · 宝宝日常</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="/baby-favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head><body data-operation="diaper"><main class="shell operation-shell"><header class="topbar"><a href="/" class="back-link">← 返回首页</a><span class="operation-brand" id="brand-name">宝宝日常</span></header><section class="operation-heading"><p class="eyebrow">12月龄内的观察记录</p><h1>记湿尿布</h1><p>只记录因尿液浸湿而更换的尿布；便便请单独点“记便便”，不要计入湿尿布。</p></section><section class="panel operation-panel"><form id="operation-form"><label>湿尿布更换时间<input id="event-time" name="occurredAt" type="datetime-local" required></label><label>观察备注（选填）<input name="note" type="text" maxlength="160" placeholder="例如：尿布明显比平时轻"></label><div class="operation-feedback" id="operation-message" role="status"></div><div class="operation-footer"><button type="submit" class="primary-button full-width operation-submit">保存湿尿布记录</button></div></form></section><section class="inline-note wet-diaper-guidance"><strong>为什么要记湿尿布？</strong><p>12月龄内，特别是出生后的早期，24小时内湿尿布的数量和重量可作为观察宝宝摄入是否充足的一条线索。英国国家医疗服务体系建议：出生第5天起，每24小时通常至少有6片较沉的湿尿布。尿布记录不能代替专业评估；如担心喂养或排尿，请咨询医护人员。</p><a href="https://www.nhs.uk/baby/breastfeeding-and-bottle-feeding/breastfeeding-problems/enough-milk/" target="_blank" rel="noopener noreferrer">查看英国国家医疗服务体系说明 ↗</a></section><p class="operation-tip">便便请使用独立的“记便便”，不会计入湿尿布次数。</p><div class="toast" id="toast" role="status"></div></main><script type="module" src="/operation.js"></script></body></html>
