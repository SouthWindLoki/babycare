<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>喂奶计划 · 宝宝日常</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="/baby-favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head><body data-config="plan"><main class="shell operation-shell"><header class="topbar"><a href="/baby.html" class="back-link">← 返回配置中心</a><span class="operation-brand" id="brand-name">宝宝日常</span></header><section class="operation-heading"><p class="eyebrow">喂奶计划</p><h1>喂奶计划</h1><p>配置喂养方式、母乳喂法和参考间隔。</p></section><section class="panel operation-panel"><form id="config-form"><fieldset id="plan-feeding-type" class="feeding-methods plan-feeding-types"><legend>喂养方式</legend><div class="symptom-options"><label class="symptom-option"><input type="radio" name="plan-feeding-type" value="formula" checked required><span>奶粉</span></label><label class="symptom-option"><input type="radio" name="plan-feeding-type" value="breast" required><span>母乳</span></label><label class="symptom-option"><input type="radio" name="plan-feeding-type" value="mixed" required><span>混合喂养（母乳＋奶粉）</span></label></div></fieldset><label id="plan-breast-field" hidden>母乳默认喂法<select id="plan-breast-method"><option value="direct">亲喂（只记时间）</option><option value="bottle">瓶喂母乳（记录毫升）</option></select></label><label id="plan-brand-field">奶粉品牌<input id="plan-formula-brand" type="text" maxlength="60" placeholder="未配置"></label><label id="plan-stage-field">奶粉段数<select id="plan-formula-stage" required><option value="1">1 段（0-6 个月）</option><option value="2">2 段（6-12 个月）</option><option value="3">3 段（12-36 个月）</option></select></label><label id="plan-amount-field">瓶喂默认奶量（毫升）<output class="range-output" id="plan-amount-output">120 毫升</output><input id="plan-amount" type="range" min="10" max="300" step="10" value="120"></label><label>两次喂奶间隔（小时）<input id="plan-interval" type="number" min="0.5" max="24" step="0.5" required></label><p class="field-hint" id="plan-feeding-hint">瓶喂默认奶量，每次滑动增加 10 毫升。</p><div class="operation-feedback" id="config-message" role="status"></div><div class="operation-footer"><button class="primary-button full-width operation-submit" type="submit">保存喂奶计划</button></div></form></section><p class="operation-tip">亲喂只记时间，瓶喂记录奶量；混合喂养每次可选择实际喂法。</p><div class="toast" id="toast" role="status"></div></main><script type="module" src="/config.js"></script></body></html>
