<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>用药计划 · 宝宝日常</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="/baby-favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head><body><main class="shell operation-shell"><header class="topbar"><a href="/medication-plans.html" class="back-link">← 返回用药计划</a><span class="operation-brand" id="brand-name">宝宝日常</span></header><section class="operation-heading"><h1 id="plan-title">添加用药计划</h1><p>按医嘱或说明书填写，时间只作日常照护参考。</p></section><section class="panel operation-panel"><form id="medication-plan-form"><div class="common-medicines"><div class="common-medicine-heading"><span class="field-label">常用药品</span><button type="button" class="secondary-button add-medicine" id="add-common-medicine">＋ 添加常用药</button></div><p class="field-hint common-hint">点击药品快速添加，单位随药品带入。</p><div class="medicine-tags" id="common-medicine-tags"></div><p id="common-load-message" role="status"></p><button type="button" class="secondary-button add-medicine" id="retry-common-medicines" hidden>重新加载常用药</button></div>
<p id="selected-plan-medicine" class="inline-note">请点选一种常用药品</p><label>每次用量<span class="plan-dose-line"><input id="medication-plan-dose" type="number" min="0.001" step="any" inputmode="decimal" required placeholder="填写实际计划用量"><span id="plan-dose-unit">请先选药品</span></span></label><fieldset class="feeding-methods plan-feeding-types"><legend>时间方式</legend><div class="symptom-options"><label class="symptom-option"><input type="radio" name="scheduleMode" value="daily" checked><span>每天固定时间</span></label><label class="symptom-option"><input type="radio" name="scheduleMode" value="interval"><span>距离上一次用药的间隔</span></label></div></fieldset><label>首次参考时间<input id="medication-plan-start" type="datetime-local" required></label><label id="medication-interval-field" hidden>用药间隔（小时）<input id="medication-plan-interval" type="number" min="0.5" max="720" step="0.5" value="24" disabled></label><p id="medication-mode-help" class="field-hint">以后每天按首次参考时间中的时刻显示；当天已记录后，参考时间顺延至明天。</p><label class="symptom-option plan-enabled"><input id="medication-plan-enabled" type="checkbox" checked><span>启用这项计划</span></label><p id="medication-plan-error" class="operation-feedback" role="status"></p><div class="operation-footer"><button type="submit" id="save-medication-plan" class="primary-button full-width operation-submit" disabled>保存用药计划</button></div></form></section><div class="toast" id="toast" role="status"></div></main><dialog id="common-medicine-dialog" class="nutrition-dialog"><form id="common-medicine-form"><h3 id="common-medicine-title">添加常用药</h3><label>药品名称<input id="common-medicine-name" maxlength="50" placeholder="填写药品名称" required></label><label>计量单位<input id="common-medicine-unit" maxlength="12" placeholder="例如：滴、粒、毫升" required></label><div class="unit-shortcuts" aria-label="常用计量单位"><button type="button">滴</button><button type="button">粒</button><button type="button">毫升</button><button type="button">毫克</button><button type="button">袋</button><button type="button">片</button></div><p id="common-medicine-error" class="operation-feedback" role="status"></p><div class="common-dialog-actions"><button type="button" id="cancel-common-medicine" class="secondary-button">取消</button><button type="submit" class="primary-button">保存常用药</button></div></form><section class="configured-common-medicines" aria-label="已添加的常用药"><h4>已添加的常用药</h4><div id="configured-common-medicines"></div></section></dialog><script type="module" src="/medication-plan.js"></script></body></html>
