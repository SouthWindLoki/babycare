<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>记身长 · 宝宝日常</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="/baby-favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head><body data-operation="length"><main class="shell operation-shell">
<header class="topbar"><a href="/" class="back-link">← 返回首页</a><span class="operation-brand" id="brand-name">宝宝日常</span></header>
<section class="operation-heading"><p class="eyebrow">一点一点，慢慢长大</p><h1>记身长</h1><p>记下宝宝的身长，看看长高了多少。</p></section>
<section class="panel operation-panel"><form id="operation-form"><label>身长（厘米）<input id="length-cm" name="lengthCm" type="number" inputmode="decimal" min="10" max="250" step="0.1" placeholder="例如：52.5" required></label><p class="field-hint">用厘米记录，最多保留一位小数。</p><label>测量日期<input id="length-measured-on" name="measuredOn" type="date" required></label><p class="inline-note" id="length-notice">同一天再次保存，会更新当天的身长。</p><div class="operation-feedback" id="operation-message" role="status"></div><div class="operation-footer"><button type="submit" class="primary-button full-width operation-submit">保存身长</button></div></form></section>
<p class="operation-tip">可以选择其他日期补记，建议每次在相近条件下测量。</p><div class="toast" id="toast" role="status"></div></main><script type="module" src="/operation.js"></script></body></html>
