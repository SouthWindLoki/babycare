<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>记喂奶 · 宝宝日常</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="/baby-favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head><body data-operation="feeding"><main class="shell operation-shell">
<header class="topbar"><a href="/" class="back-link">← 返回首页</a><span class="operation-brand" id="brand-name">宝宝日常</span></header>
<section class="operation-heading"><p class="eyebrow">吃饱啦，记一下</p><h1>记喂奶</h1><p>按本次实际喂法记录，下一次时间仅作参考。</p></section>
<section class="panel operation-panel"><form id="operation-form"><p id="feeding-plan-note" class="inline-note">正在读取喂奶计划…</p><fieldset class="feeding-methods" id="feeding-methods"><legend>本次喂法</legend><div class="symptom-options" id="feeding-method-options"></div></fieldset><div id="feeding-amount-field"><label>喂奶量（毫升）<output class="range-output" id="amount-output" for="amount-ml">120 毫升</output><input id="amount-ml" name="amountMl" type="range" inputmode="numeric" min="10" max="300" step="10" value="120" required></label>
<p class="field-hint">每次滑动增加 10 毫升，先按计划奶量带出，也可以按实际情况调整。</p></div><p class="inline-note" id="direct-feeding-note" hidden>母乳亲喂只记录时间，不需要填写毫升数。</p>
<label>喂奶时间<input id="event-time" name="occurredAt" type="datetime-local" required></label><label>备注（选填）<input name="note" type="text" maxlength="160" placeholder="例如：喝完了，状态很好"></label><div class="operation-feedback" id="operation-message" role="status"></div><div class="operation-footer"><button type="submit" class="primary-button full-width operation-submit">保存喂奶记录</button></div></form></section>
<p class="operation-tip">时间已默认为现在，也可以修改时间补记。</p><div class="toast" id="toast" role="status"></div></main><script type="module" src="/operation.js"></script></body></html>
