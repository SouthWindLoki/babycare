<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>记便便 · 宝宝日常</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="/baby-favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head><body data-operation="stool"><main class="shell operation-shell">
<header class="topbar"><a href="/" class="back-link">← 返回首页</a><span class="operation-brand" id="brand-name">宝宝日常</span></header>
<section class="operation-heading"><p class="eyebrow">出生后前2个月重点观察</p><h1>记便便</h1><p>记录排便时间和颜色；照片可以不拍。出生～2月龄颜色拿不准可拍照，2～6月龄出现明显颜色或性状变化时仍可拍，6月龄后异常或就诊时再留存照片。2月龄后入口会收起，如有异常颜色或症状请记异常。</p></section>
<section class="panel operation-panel"><form id="operation-form"><div class="field-label">便便照片（选填）</div><div class="photo-pickers"><label class="photo-picker">拍一张照片<input class="file-control" id="camera-photo" type="file" accept="image/*" capture="environment"></label><label class="photo-picker secondary-picker">从相册选择<input class="file-control" id="gallery-photo" type="file" accept="image/*"></label></div>
<div id="photo-preview" class="photo-preview" hidden><img id="selected-photo" alt="即将保存的便便照片"><p>照片已就绪，可重新拍照或选择替换</p></div><fieldset class="stool-colors"><legend>便便颜色（选填）</legend><div class="color-options"><label class="color-option"><input type="radio" name="stoolColor" value="墨绿色"><span class="stool-swatch" style="--stool-color:#1d3a2c"></span><span>墨绿色</span></label><label class="color-option"><input type="radio" name="stoolColor" value="黄绿色"><span class="stool-swatch" style="--stool-color:#879b27"></span><span>黄绿色</span></label><label class="color-option"><input type="radio" name="stoolColor" value="黄色"><span class="stool-swatch" style="--stool-color:#e2b83f"></span><span>黄色</span></label><label class="color-option"><input type="radio" name="stoolColor" value="棕黄色"><span class="stool-swatch" style="--stool-color:#b88a3d"></span><span>棕黄色</span></label><label class="color-option"><input type="radio" name="stoolColor" value="棕色"><span class="stool-swatch" style="--stool-color:#76502f"></span><span>棕色</span></label><label class="color-option"><input type="radio" name="stoolColor" value="黑色"><span class="stool-swatch" style="--stool-color:#252522"></span><span>黑色</span></label><label class="color-option"><input type="radio" name="stoolColor" value="灰白色"><span class="stool-swatch" style="--stool-color:#b8b8ad"></span><span>灰白色</span></label><label class="color-option"><input type="radio" name="stoolColor" value="红色"><span class="stool-swatch" style="--stool-color:#a94036"></span><span>红色</span></label><label class="color-option"><input type="radio" name="stoolColor" value="其他"><span class="stool-swatch" style="--stool-color:#a28e7b"></span><span>其他</span></label></div><p class="field-hint">颜色只是观察记录；黑色、灰白色、红色或伴随宝宝不适时，请及时咨询医护人员。</p></fieldset><label>排便时间<input id="event-time" name="occurredAt" type="datetime-local" required></label><label>备注（选填）<input name="note" type="text" maxlength="160" placeholder="例如：次数、宝宝状态"></label><div class="operation-feedback" id="operation-message" role="status"></div><div class="operation-footer"><button type="submit" class="primary-button full-width operation-submit">保存便便记录</button></div></form></section>
<p class="operation-tip">照片只保存在本地数据库中，家人打开同一地址就能查看。</p><div class="toast" id="toast" role="status"></div></main><script type="module" src="/operation.js"></script></body></html>
