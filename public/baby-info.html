<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>宝宝信息 · 宝宝日常</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="/baby-favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head><body data-config="profile"><main class="shell operation-shell"><header class="topbar"><a href="/baby.html" class="back-link">← 返回配置中心</a><span class="operation-brand" id="brand-name">宝宝日常</span></header><section class="operation-heading"><p class="eyebrow">宝宝信息</p><h1>宝宝信息</h1><p>名字和生日会用于首页显示和月龄计算。</p></section><section class="panel operation-panel"><form id="config-form"><label>宝宝名字<input id="profile-name" type="text" maxlength="30" placeholder="输入名字或小名" required></label><label>宝宝生日<input id="profile-birthday" type="date" required></label><label>出生体重（克，选填）<input id="profile-birth-weight" type="number" inputmode="numeric" min="100" max="100000" step="1" placeholder="例如：3200"></label><p class="field-hint" id="birth-weight-preview">体重按克记录，保存后可换算为斤。</p><label>出生身长（厘米，选填）<input id="profile-birth-length" type="number" inputmode="decimal" min="10" max="250" step="0.1" placeholder="例如：50.0"></label><p class="inline-note">信息来源：可查看出生证明填写出生体重和出生身长。</p><div class="operation-feedback" id="config-message" role="status"></div><div class="operation-footer"><button class="primary-button full-width operation-submit" type="submit">保存宝宝信息</button></div></form></section><p class="operation-tip">这些信息保存在本地数据库中。</p><div class="toast" id="toast" role="status"></div></main><script type="module" src="/config.js"></script></body></html>
