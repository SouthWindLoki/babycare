<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>称体重 · 宝宝日常</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="/baby-favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head><body data-operation="weight"><main class="shell operation-shell">
<header class="topbar"><a href="/" class="back-link">← 返回首页</a><span class="operation-brand" id="brand-name">宝宝日常</span></header>
<section class="operation-heading"><p class="eyebrow">一天一点，小小成长</p><h1>称体重</h1><p>每天称一次，记下宝宝的体重。</p></section>
<section class="panel operation-panel"><form id="operation-form"><label>体重（克）<input id="weight-grams" name="weightGrams" type="number" inputmode="numeric" min="100" max="100000" step="1" placeholder="例如：3500" required></label><p class="field-hint" id="jin-preview">例如：3500 克相当于 7.00 斤</p><label>称重日期<input id="measured-on" name="measuredOn" type="date" required></label><p class="inline-note" id="weight-notice">同一天再次保存，会更新当天的体重。</p><div class="operation-feedback" id="operation-message" role="status"></div><div class="operation-footer"><button type="submit" class="primary-button full-width operation-submit">保存今天的体重</button></div></form></section>
<p class="operation-tip">可以选择其他日期补记，建议每次在相近条件下称重。</p><div class="toast" id="toast" role="status"></div></main><script type="module" src="/operation.js"></script></body></html>
